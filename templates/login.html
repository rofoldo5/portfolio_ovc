<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
  :root {
    --red:#c0392b; --green:#27ae60; --dark:#0a0a0a;
    --light:#e8e8e8; --dim:#555;
    --font-vt:'VT323',monospace; --font-mono:'IBM Plex Mono',monospace;
  }
  body {
    background: var(--dark); color: var(--light);
    font-family: var(--font-mono);
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }

  .terminal {
    width: min(480px, 94vw);
    border: 1px solid #2a2a2a;
    background: #0d0d0d;
    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 0 1px #111;
  }

  .term-titlebar {
    background: #161616;
    padding: 0.6rem 1rem;
    display: flex; align-items: center; gap: 0.5rem;
    border-bottom: 1px solid #1e1e1e;
  }
  .dot { width:12px;height:12px;border-radius:50%; }
  .dot-r{background:#c0392b;} .dot-y{background:#f39c12;} .dot-g{background:#27ae60;}
  .term-title {
    font-family: var(--font-vt); font-size:1rem;
    color: var(--dim); margin-left:auto; letter-spacing:1px;
  }

  .term-body { padding: 2rem; }

  .prompt-line {
    font-family: var(--font-vt); font-size: 1.1rem;
    color: var(--green); margin-bottom: 1.5rem;
    line-height: 1.8;
  }
  .prompt-line span { color: var(--dim); }

  .field-group { margin-bottom: 1.2rem; }
  .field-label {
    font-family: var(--font-vt); font-size: 1rem;
    color: var(--dim); margin-bottom: 4px;
    display: block;
  }
  .field-label::before { content:'$ '; color:var(--green); }

  input {
    width: 100%;
    background: transparent;
    border: none; border-bottom: 1px solid #2e2e2e;
    padding: 0.5rem 0;
    color: var(--light);
    font-family: var(--font-mono); font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--green); }
  input::placeholder { color: var(--dim); }

  .btn-login {
    width: 100%;
    margin-top: 1.5rem;
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: var(--font-vt); font-size: 1.2rem;
    letter-spacing: 2px;
    padding: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-login:hover {
    background: var(--green); color: #000;
    box-shadow: 0 0 20px rgba(39,174,96,0.3);
  }

  .error-line {
    font-family: var(--font-vt); font-size: 1rem;
    color: var(--red); margin-top: 1rem;
    padding: 0.5rem;
    border-left: 2px solid var(--red);
  }
  .error-line::before { content: '[ERR] '; }

  .back-link {
    display: block; text-align: center;
    margin-top: 1.5rem;
    font-family: var(--font-vt); font-size: 0.95rem;
    color: var(--dim); text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--light); }
  .back-link::before { content: '← '; }

  /* scan-line effect */
  .terminal::after {
    content:''; pointer-events:none;
    position:fixed; inset:0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px
    );
  }
</style>
</head>
<body>
<div class="terminal">
  <div class="term-titlebar">
    <div class="dot dot-r"></div>
    <div class="dot dot-y"></div>
    <div class="dot dot-g"></div>
    <span class="term-title">admin@portfolio:~</span>
  </div>
  <div class="term-body">
    <div class="prompt-line">
      <span>PortfolioOS</span> Login Manager v1.0<br>
      Ingresa tus credenciales para continuar.
    </div>

    <form method="POST" action="/login">
      <div class="field-group">
        <label class="field-label" for="username">username</label>
        <input type="text" id="username" name="username"
               autocomplete="username" placeholder="admin" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="password">password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn-login" type="submit">▶ AUTHENTICATE</button>

      {% if error %}
      <div class="error-line">{{ error }}</div>
      {% endif %}
    </form>

    <a href="/" class="back-link">Volver al inicio</a>
  </div>
</div>
</body>
</html>
